<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — pavellevitin.co.il</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f11;
      color: #e8e8ea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 40px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #fff;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 48px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: #1a1a1f;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card:hover {
      border-color: #555;
      background: #1f1f26;
      transform: translateY(-2px);
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .card-url {
      font-size: 0.78rem;
      color: #555;
      word-break: break-all;
    }

    .card-arrow {
      margin-top: 12px;
      font-size: 1.1rem;
      color: #444;
      align-self: flex-end;
    }

    .empty {
      color: #555;
      font-size: 0.9rem;
      margin-top: 40px;
    }

    .admin-link {
      margin-top: 60px;
      font-size: 0.78rem;
      color: #333;
      text-decoration: none;
    }

    .admin-link:hover { color: #666; }
  </style>
</head>
<body>
  <h1>pavellevitin.co.il</h1>
  <p class="subtitle">Projects</p>

  <div class="grid" id="grid">
    <p class="empty">Loading...</p>
  </div>

  <a href="/admin" class="admin-link">admin</a>

  <script>
    fetch('/api/projects')
      .then(r => r.json())
      .then(projects => {
        const grid = document.getElementById('grid');
        const enabled = projects.filter(p => p.enabled);
        if (enabled.length === 0) {
          grid.innerHTML = '<p class="empty">No projects configured yet.</p>';
          return;
        }
        grid.innerHTML = enabled.map(p => `
          <a class="card" href="${p.url}" target="_blank" rel="noopener noreferrer">
            <span class="card-name">${escHtml(p.name)}</span>
            <span class="card-url">${escHtml(p.url)}</span>
            <span class="card-arrow">↗</span>
          </a>
        `).join('');
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<p class="empty">Failed to load projects.</p>';
      });

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
