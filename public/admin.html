<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — pavellevitin.co.il</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f11;
      color: #e8e8ea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 40px;
    }

    h1 { font-size: 1.4rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .back { font-size: 0.82rem; color: #555; text-decoration: none; margin-bottom: 40px; display: block; }
    .back:hover { color: #888; }

    section {
      width: 100%;
      max-width: 600px;
      margin-bottom: 40px;
    }

    h2 { font-size: 0.95rem; font-weight: 600; color: #aaa; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }

    .field { margin-bottom: 12px; }
    label { display: block; font-size: 0.82rem; color: #777; margin-bottom: 5px; }
    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%;
      background: #1a1a1f;
      border: 1px solid #2a2a30;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #555; }

    button {
      background: #2a2a30;
      border: 1px solid #3a3a42;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 0.88rem;
      padding: 9px 18px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #333340; }
    button.danger { border-color: #5a2020; }
    button.danger:hover { background: #3a1515; }
    button.success-btn { border-color: #1a4a2a; }
    button.success-btn:hover { background: #152e1e; }

    .project-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1a1a1f;
      border: 1px solid #2a2a30;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .project-info { flex: 1; min-width: 0; }
    .project-name { font-size: 0.95rem; font-weight: 600; color: #fff; }
    .project-url { font-size: 0.78rem; color: #555; word-break: break-all; margin-top: 2px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-on { background: #3a9a5a; }
    .dot-off { background: #555; }

    .msg {
      font-size: 0.85rem;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .msg.ok { background: #152e1e; color: #5cb87a; }
    .msg.err { background: #2e1515; color: #c06060; }

    #auth-section {
      width: 100%;
      max-width: 360px;
      margin: 80px auto;
    }
  </style>
</head>
<body>
  <h1>Admin</h1>
  <a href="/" class="back">← back to dashboard</a>

  <div id="auth-section">
    <div class="field">
      <label>Admin password</label>
      <input type="password" id="password-input" placeholder="Enter password" />
    </div>
    <button onclick="unlock()">Unlock</button>
    <div id="auth-msg"></div>
  </div>

  <div id="main" style="display:none; width:100%; max-width:600px;">

    <section>
      <h2>Projects</h2>
      <div id="projects-list">Loading...</div>
    </section>

    <section>
      <h2>Add project</h2>
      <div class="field">
        <label>Name</label>
        <input type="text" id="new-name" placeholder="My Project" />
      </div>
      <div class="field">
        <label>URL</label>
        <input type="url" id="new-url" placeholder="https://pavellevitin.co.il:4009" />
      </div>
      <button onclick="addProject()">Add project</button>
      <div id="add-msg"></div>
    </section>
  </div>

  <script>
    let password = '';

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function unlock() {
      password = document.getElementById('password-input').value;
      if (!password) return;
      // Test with a GET (no auth needed) then show UI — real auth tested on first mutating call
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      loadProjects();
    }

    document.getElementById('password-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') unlock();
    });

    function loadProjects() {
      fetch('/api/projects')
        .then(r => r.json())
        .then(renderProjects)
        .catch(() => {
          document.getElementById('projects-list').textContent = 'Failed to load.';
        });
    }

    function renderProjects(projects) {
      const el = document.getElementById('projects-list');
      if (!projects.length) { el.textContent = 'No projects yet.'; return; }
      el.innerHTML = projects.map(p => `
        <div class="project-row">
          <span class="status-dot ${p.enabled ? 'dot-on' : 'dot-off'}"></span>
          <div class="project-info">
            <div class="project-name">${escHtml(p.name)}</div>
            <div class="project-url">${escHtml(p.url)}</div>
          </div>
          <button class="${p.enabled ? 'danger' : 'success-btn'}" onclick="toggleProject(${p.id}, ${!p.enabled})">
            ${p.enabled ? 'Disable' : 'Enable'}
          </button>
        </div>
      `).join('');
    }

    function toggleProject(id, enabled) {
      fetch(`/api/projects/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
        body: JSON.stringify({ enabled })
      })
      .then(r => {
        if (r.status === 401) { showMsg('projects-msg', 'Wrong password.', true); return; }
        return r.json();
      })
      .then(data => { if (data) loadProjects(); })
      .catch(() => showMsg('projects-msg', 'Request failed.', true));
    }

    function addProject() {
      const name = document.getElementById('new-name').value.trim();
      const url = document.getElementById('new-url').value.trim();
      if (!name || !url) { showMsg('add-msg', 'Name and URL are required.', true); return; }

      fetch('/api/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
        body: JSON.stringify({ name, url })
      })
      .then(r => {
        if (r.status === 401) { showMsg('add-msg', 'Wrong password.', true); return null; }
        if (!r.ok) { showMsg('add-msg', 'Server error.', true); return null; }
        return r.json();
      })
      .then(data => {
        if (data) {
          document.getElementById('new-name').value = '';
          document.getElementById('new-url').value = '';
          showMsg('add-msg', `"${escHtml(data.name)}" added.`, false);
          loadProjects();
        }
      })
      .catch(() => showMsg('add-msg', 'Request failed.', true));
    }

    function showMsg(id, text, isError) {
      let el = document.getElementById(id);
      if (!el) {
        el = document.createElement('div');
        el.id = id;
        document.getElementById('main').appendChild(el);
      }
      el.className = 'msg ' + (isError ? 'err' : 'ok');
      el.textContent = text;
      setTimeout(() => { el.textContent = ''; el.className = ''; }, 4000);
    }
  </script>
</body>
</html>
