# HTTP → HTTPS redirect
server {
    listen 80;
    server_name pavellevitin.co.il www.pavellevitin.co.il;
    return 301 https://pavellevitin.co.il$request_uri;
}

# www → apex redirect (HTTPS)
server {
    listen 443 ssl;
    server_name www.pavellevitin.co.il;

    ssl_certificate     /etc/letsencrypt/live/pavellevitin.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pavellevitin.co.il/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://pavellevitin.co.il$request_uri;
}

# HTTPS — proxy to dashboard + apps
server {
    listen 443 ssl;
    server_name pavellevitin.co.il;

    ssl_certificate     /etc/letsencrypt/live/pavellevitin.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pavellevitin.co.il/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HBS Studio static tools (rewrite /tools/ → /hbs/tools/ for basePath)
    location /tools {
        rewrite ^/tools/(.*)$ /hbs/tools/$1 break;
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # HBS Studio
    location /hbs {
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # payRase (trailing slash strips /paycheck prefix before passing to Express)
    location /paycheck {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ternerClock (session-gated — see /auth-verify below)
    location /ternerclock {
        auth_request       /auth-verify;
        error_page         401 = @require_login;

        proxy_pass         http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # HBS Studio API routes (tool iframes call these without /hbs prefix)
    # Rewrite /api/... → /hbs/api/... to match Next.js basePath
    location /api/uploads {
        rewrite ^/api/(.*)$ /hbs/api/$1 break;
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /api/allowed-emails {
        rewrite ^/api/(.*)$ /hbs/api/$1 break;
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /api/users {
        rewrite ^/api/(.*)$ /hbs/api/$1 break;
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /api/auth {
        rewrite ^/api/(.*)$ /hbs/api/$1 break;
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Dashboard's own auth endpoints — exact matches win over the /api/auth
    # prefix block above, so these stay on the dashboard app (port 3001)
    # instead of being forwarded to HBS Studio.
    location = /api/auth/login {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/auth/logout {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/auth/verify {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/pre-signup {
        rewrite ^/api/(.*)$ /hbs/api/$1 break;
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # fields (react_field_manage) — session-gated
    location /fields {
        auth_request       /auth-verify;
        error_page         401 = @require_login;

        proxy_pass         http://127.0.0.1:4800;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Internal endpoint: validates the dashboard_session cookie against
    # the Next.js dashboard app. Used by auth_request above.
    location = /auth-verify {
        internal;
        proxy_pass              http://127.0.0.1:3001/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie          $http_cookie;
        proxy_set_header        X-Original-URI  $request_uri;
    }

    # Unauthenticated access to a gated location bounces here
    location @require_login {
        return 302 https://pavellevitin.co.il/login?from=$request_uri;
    }

    # Dashboard
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
