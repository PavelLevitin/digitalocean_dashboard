# HTTP → HTTPS redirect
server {
    listen 80;
    server_name pavellevitin.co.il;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy to dashboard + apps
server {
    listen 443 ssl;
    server_name pavellevitin.co.il;

    ssl_certificate     /etc/letsencrypt/live/pavellevitin.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pavellevitin.co.il/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HBS Studio
    location /hbs {
        proxy_pass         http://127.0.0.1:4009;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # payRase (trailing slash strips /paycheck prefix before passing to Express)
    location /paycheck {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ternerClock
    location /ternerclock {
        proxy_pass         http://127.0.0.1:4700;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Dashboard
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
